<text x="378.0" y="826.0" font-size="15" fill="#c4161c" font-weight="bold" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">y = +X</text>
<text x="300.0" y="930.0" font-size="14" fill="#1f5fbf" font-weight="normal" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">⊙ x : 기둥 축 방향(화면 밖으로)</text>
<text x="300.0" y="972.0" font-size="14" fill="#1a8a3a" font-weight="normal" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">발→K = (0, 100) 수직 → 높이가 연직 → 강축으로 하중을 받음</text>
