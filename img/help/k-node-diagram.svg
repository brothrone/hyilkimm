<text x="776.0" y="218.0" font-size="15" fill="#555" font-weight="normal" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">(K까지의 거리는 상관없음, 방향만 쓴다)</text>
<text x="776.0" y="248.0" font-size="16" fill="#444" font-weight="bold" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">③ y축</text>
<text x="844.0" y="248.0" font-size="15" fill="#222" font-weight="normal" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">y = z × x (오른손 법칙)</text>
<text x="776.0" y="290.0" font-size="16" fill="#c4161c" font-weight="bold" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">결과</text>
<text x="776.0" y="318.0" font-size="15" fill="#222" font-weight="normal" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">W 보 : x = +X, z = +Y, y = −Z</text>
<text x="776.0" y="344.0" font-size="15" fill="#222" font-weight="normal" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">C 기둥 : x = +Z, z = +Y, y = +X</text>
<text x="776.0" y="376.0" font-size="15" fill="#c4161c" font-weight="bold" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">→ 두 부재 모두 z = 위(+Y)</text>
<text x="776.0" y="402.0" font-size="15" fill="#c4161c" font-weight="bold" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">→ 단면 높이(W3)가 위로 선다</text>
<text x="30.0" y="560.0" font-size="17" fill="#111" font-weight="bold" text-anchor="start" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">② 기둥 축 방향에서 본 단면 (기둥이 화면 쪽으로 뻗음 = x가 ⊙, X는 오른쪽, Y는 위)</text>
