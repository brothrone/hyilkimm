<text x="900.0" y="972.0" font-size="14" fill="#c4161c" font-weight="normal" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">발→K = (−60, 100) → 약 31° 기울어진 z → 단면이 기움 ✗</text>
<text x="600.0" y="1000.0" font-size="14" fill="#555" font-weight="normal" text-anchor="middle" font-family="Noto Sans CJK KR, Malgun Gothic, WenQuanYi Zen Hei, sans-serif">K 노드는 해석에 들어가지 않고 방향만 정한다 — 부재마다 그 부재 바로 위에 따로 만든다</text>
