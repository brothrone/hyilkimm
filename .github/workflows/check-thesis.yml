name: Verify public thesis editor
on:
  push:
    branches: [verify/thesis-workspace]
permissions: {}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: python -m pip install -q playwright==1.56.0
      - name: Check two independent anonymous sessions
        shell: python
        run: |
          import time, uuid
          from playwright.sync_api import sync_playwright, expect
          import os
          site="https://brothrone.github.io/hyilkimm/"
          probe="https://pad.nixnet.services/bAGiCdA_TZ-IFhg_Te7pzA?edit"
          def attached(page):
              page.goto(probe,wait_until="domcontentloaded",timeout=90000)
              cm=page.locator(".ui-edit-area .CodeMirror, .CodeMirror").first
              expect(cm).to_be_visible(timeout=60000)
              expect(cm.locator(".CodeMirror-code")).to_contain_text("공동 메모 동기화 확인",timeout=45000)
              return cm
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path="/usr/bin/google-chrome",args=["--no-sandbox"])
              contexts=[browser.new_context(locale="ko-KR") for _ in range(3)]
              pages=[ctx.new_page() for ctx in contexts]
              for page in pages:
                  page.on("console", lambda m: print("browser:",m.text[:150]) if m.type=="error" else None)
              first,second=map(attached,pages[:2])
              marker="한국어편집확인"+uuid.uuid4().hex[:6]
              first.click()
              pages[0].keyboard.press("Control+End")
              pages[0].keyboard.insert_text(marker)
              try:
                  expect(second).to_contain_text(marker,timeout=30000)
                  third=attached(pages[2])
                  expect(third).to_contain_text(marker,timeout=30000)
              finally:
                  pages[0].keyboard.press("Control+z")
              expect(second).not_to_contain_text(marker,timeout=25000)
              home=contexts[0].new_page()
              for attempt in range(18):
                  home.goto(site+"?memo="+uuid.uuid4().hex,wait_until="domcontentloaded")
                  if home.locator("#memo-preview").count(): break
                  time.sleep(4)
              expect(home.locator("#memo-preview")).to_contain_text("초록",timeout=45000)
              with home.expect_popup() as popup:
                  home.locator("#open").click()
              actual=popup.value
              expect(actual.locator(".CodeMirror").first).to_be_visible(timeout=60000)
              expect(actual.locator(".CodeMirror-code").first).to_contain_text("초록",timeout=30000)
              # Inspect, without changing the team's migrated notes.
              editable=actual.locator(".CodeMirror").first.evaluate("(el) => !el.CodeMirror.getOption('readOnly')")
              assert editable
              assert "로그인" in actual.locator("body").text_content()
              home.locator("#references").click()
              expect(home.locator("#reference-editor")).to_contain_text("시험 데이터",timeout=45000)
              with home.expect_popup() as ref_popup:
                  home.locator(".link-head a").click()
              refs=ref_popup.value
              expect(refs.locator(".CodeMirror-code").first).to_contain_text("시험 데이터",timeout=60000)
              print("Live previews, Korean interface, migrated notes and anonymous two-browser synchronization passed.")
